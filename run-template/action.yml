name: 'Underleaf Run Template'
description: 'Execute command templates on Underleaf servers via API'
author: 'Ambient Labs'

branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  api-url:
    description: 'Underleaf API URL'
    required: false
    default: 'https://api.underleafdev.com'
  
  api-token:
    description: 'Underleaf API token (uf_xxxxx_...)'
    required: true
  
  organization-id:
    description: 'Organization ID'
    required: true
  
  template-id:
    description: 'Template ID to execute'
    required: true
  
  inputs:
    description: 'JSON object of input values for template variables (e.g., {"version":"1.2.3","env":"prod"})'
    required: false
    default: '{}'
  
  all-servers:
    description: 'Run on all servers in the organization'
    required: false
    default: 'false'
  
  server-ids:
    description: 'Comma-separated list of server IDs to target'
    required: false
    default: ''
  
  tags:
    description: 'JSON object of tags to filter servers (e.g., {"environment":"production"})'
    required: false
    default: ''

outputs:
  job-id:
    description: 'Job ID for tracking template execution'
    value: ${{ steps.run-template.outputs.job-id }}
  
  template-id:
    description: 'Template ID that was executed'
    value: ${{ steps.run-template.outputs.template-id }}
  
  timestamp:
    description: 'Timestamp of template execution'
    value: ${{ steps.run-template.outputs.timestamp }}
  
  trigger-source:
    description: 'Source of the trigger (manual, cron)'
    value: ${{ steps.run-template.outputs.trigger-source }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        source "${{ github.action_path }}/../scripts/common.sh"
        validate_targeting "${{ inputs.all-servers }}" "${{ inputs.server-ids }}" "${{ inputs.tags }}"
    
    - name: Run template
      id: run-template
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        API_TOKEN: ${{ inputs.api-token }}
        ORG_ID: ${{ inputs.organization-id }}
        TEMPLATE_ID: ${{ inputs.template-id }}
        INPUTS: ${{ inputs.inputs }}
        ALL_SERVERS: ${{ inputs.all-servers }}
        SERVER_IDS: ${{ inputs.server-ids }}
        TAGS: ${{ inputs.tags }}
      run: |
        set -euo pipefail
        
        echo "::group::Loading helper scripts"
        source "${{ github.action_path }}/../scripts/common.sh" || {
          echo "::error::Failed to load common.sh"
          exit 1
        }
        source "${{ github.action_path }}/../scripts/api.sh" || {
          echo "::error::Failed to load api.sh"
          exit 1
        }
        echo "::endgroup::"
        
        echo "::group::Building request payload"
        echo "::debug::Template ID: $TEMPLATE_ID"
        echo "::debug::Organization ID: $ORG_ID"
        echo "::debug::Inputs: $INPUTS"
        
        # Build base payload with inputs
        payload=$(jq -n --argjson inp "$INPUTS" '{inputs: $inp}') || {
          echo "::error::Failed to parse inputs JSON"
          echo "::error::Inputs value: $INPUTS"
          echo "::error::Ensure inputs is valid JSON (e.g., {} or {\"key\":\"value\"})"
          exit 1
        }
        echo "::debug::Base payload created: $payload"
        
        # Add targeting
        echo "::debug::Building targeting JSON..."
        targeting=$(build_targeting_json "$ALL_SERVERS" "$SERVER_IDS" "$TAGS") || {
          echo "::error::Failed to build targeting JSON"
          exit 1
        }
        
        payload=$(echo "$payload" | jq ". + $targeting") || {
          echo "::error::Failed to merge targeting into payload"
          echo "::error::Payload: $payload"
          echo "::error::Targeting: $targeting"
          exit 1
        }
        
        payload=$(echo "$payload" | jq -c .) || {
          echo "::error::Failed to compact JSON payload"
          exit 1
        }
        echo "::notice::Final payload: $payload"
        echo "::endgroup::"
        
        echo "::group::Triggering template execution"
        # Make API request to template trigger endpoint
        response=$(make_api_request "$API_URL" "$API_TOKEN" "$ORG_ID" "POST" "/api/v1/servers/templates/${TEMPLATE_ID}/trigger" "$payload") || {
          echo "::error::Template trigger API request failed"
          exit 1
        }
        echo "::debug::API Response: $response"
        echo "::endgroup::"
        
        echo "::group::Extracting response data"
        # Extract outputs
        job_id=$(echo "$response" | jq -r '.job_id' 2>/dev/null) || {
          echo "::error::Failed to parse job_id from response"
          echo "::error::Response: $response"
          exit 1
        }
        template_id=$(echo "$response" | jq -r '.template_id' 2>/dev/null) || true
        timestamp=$(echo "$response" | jq -r '.timestamp' 2>/dev/null) || true
        trigger_source=$(echo "$response" | jq -r '.trigger_source // "manual"' 2>/dev/null) || true
        
        if [[ -z "$job_id" || "$job_id" == "null" ]]; then
          echo "::error::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "::error::Failed to extract job_id from API response"
          echo "::error::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "::error::This usually means:"
          echo "::error::  1. The API returned an unexpected response format"
          echo "::error::  2. The template execution failed on the server"
          echo "::error::  3. The template ID is invalid"
          echo "::error::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "::error::Full Response: $response"
          echo "::error::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1
        fi
        echo "::endgroup::"
        
        # Set outputs
        echo "job-id=$job_id" >> $GITHUB_OUTPUT
        echo "template-id=$template_id" >> $GITHUB_OUTPUT
        echo "timestamp=$timestamp" >> $GITHUB_OUTPUT
        echo "trigger-source=$trigger_source" >> $GITHUB_OUTPUT
        
        echo "::notice::✅ Template executed successfully"
        echo "::notice::📋 Job ID: $job_id"
        echo "::notice::📝 Template ID: $template_id"
        echo "::notice::⏰ Timestamp: $timestamp"
