name: 'Underleaf Run Command'
description: 'Execute commands on Underleaf servers via API'
author: 'Ambient Labs'

branding:
  icon: 'terminal'
  color: 'green'

inputs:
  api-url:
    description: 'Underleaf API URL'
    required: false
    default: 'https://api.underleafdev.com'
  
  api-token:
    description: 'Underleaf API token (uf_xxxxx_...)'
    required: true
  
  organization-id:
    description: 'Organization ID'
    required: true
  
  command:
    description: 'Command to execute'
    required: true
  
  work-dir:
    description: 'Working directory for command execution'
    required: false
    default: ''
  
  timeout:
    description: 'Command timeout in seconds'
    required: false
    default: '300'
  
  all-servers:
    description: 'Run on all servers in the organization'
    required: false
    default: 'false'
  
  server-ids:
    description: 'Comma-separated list of server IDs to target'
    required: false
    default: ''
  
  tags:
    description: 'JSON object of tags to filter servers (e.g., {"environment":"production"})'
    required: false
    default: ''
  
  env-vars:
    description: 'JSON object of environment variables to set (e.g., {"KEY":"value"})'
    required: false
    default: ''

  wait:
    description: 'Wait for the command to finish before completing the step'
    required: false
    default: 'false'

  poll-interval:
    description: 'Seconds between status checks (only used when wait=true)'
    required: false
    default: '10'

outputs:
  job-id:
    description: 'Job ID for tracking command execution'
    value: ${{ steps.run-command.outputs.job-id }}
  
  timestamp:
    description: 'Timestamp of command execution'
    value: ${{ steps.run-command.outputs.timestamp }}

  status:
    description: 'Final job status when wait=true: success or failure'
    value: ${{ steps.wait-command.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        source "${{ github.action_path }}/../scripts/common.sh"
        validate_targeting "${{ inputs.all-servers }}" "${{ inputs.server-ids }}" "${{ inputs.tags }}"
    
    - name: Run command
      id: run-command
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        API_TOKEN: ${{ inputs.api-token }}
        ORG_ID: ${{ inputs.organization-id }}
        COMMAND: ${{ inputs.command }}
        WORK_DIR: ${{ inputs.work-dir }}
        TIMEOUT: ${{ inputs.timeout }}
        ALL_SERVERS: ${{ inputs.all-servers }}
        SERVER_IDS: ${{ inputs.server-ids }}
        TAGS: ${{ inputs.tags }}
        ENV_VARS: ${{ inputs.env-vars }}
      run: |
        set -euo pipefail
        
        echo "::group::Loading helper scripts"
        source "${{ github.action_path }}/../scripts/common.sh" || {
          echo "::error::Failed to load common.sh"
          exit 1
        }
        source "${{ github.action_path }}/../scripts/api.sh" || {
          echo "::error::Failed to load api.sh"
          exit 1
        }
        echo "::endgroup::"
        
        echo "::group::Building request payload"
        echo "::debug::Command: $COMMAND"
        echo "::debug::Working Directory: $WORK_DIR"
        echo "::debug::Timeout: $TIMEOUT"
        echo "::debug::Organization ID: $ORG_ID"
        
        # Build base payload with command-specific fields
        payload=$(jq -n \
          --arg cmd "$COMMAND" \
          --arg wd "$WORK_DIR" \
          --argjson to "$TIMEOUT" \
          '{
            command: $cmd,
            work_dir: $wd,
            timeout: $to
          }') || {
          echo "::error::Failed to build base command payload"
          echo "::error::Command: $COMMAND"
          echo "::error::Work Dir: $WORK_DIR"
          echo "::error::Timeout: $TIMEOUT"
          exit 1
        }
        echo "::debug::Base payload created: $payload"
        
        # Add targeting
        echo "::debug::Building targeting JSON..."
        targeting=$(build_targeting_json "$ALL_SERVERS" "$SERVER_IDS" "$TAGS") || {
          echo "::error::Failed to build targeting JSON"
          exit 1
        }
        
        payload=$(echo "$payload" | jq ". + $targeting") || {
          echo "::error::Failed to merge targeting into payload"
          echo "::error::Payload: $payload"
          echo "::error::Targeting: $targeting"
          exit 1
        }
        
        # Add env_vars if provided
        if [[ -n "$ENV_VARS" ]]; then
          echo "::debug::Adding environment variables: $ENV_VARS"
          payload=$(echo "$payload" | jq --argjson ev "$ENV_VARS" '. + {env_vars: $ev}') || {
            echo "::error::Failed to parse env_vars JSON"
            echo "::error::Env vars value: $ENV_VARS"
            echo "::error::Ensure env-vars is valid JSON (e.g., {} or {\"KEY\":\"value\"})"
            exit 1
          }
        fi
        
        payload=$(echo "$payload" | jq -c .) || {
          echo "::error::Failed to compact JSON payload"
          exit 1
        }
        echo "::notice::Final payload: $payload"
        echo "::endgroup::"
        
        echo "::group::Executing command on servers"
        # Make API request
        response=$(make_api_request "$API_URL" "$API_TOKEN" "$ORG_ID" "POST" "/api/v1/servers/commands/run" "$payload") || {
          echo "::error::Command execution API request failed"
          exit 1
        }
        echo "::debug::API Response: $response"
        echo "::endgroup::"
        
        echo "::group::Extracting response data"
        # Extract outputs
        job_id=$(echo "$response" | jq -r '.job_id' 2>/dev/null) || {
          echo "::error::Failed to parse job_id from response"
          echo "::error::Response: $response"
          exit 1
        }
        timestamp=$(echo "$response" | jq -r '.timestamp' 2>/dev/null) || true
        
        if [[ -z "$job_id" || "$job_id" == "null" ]]; then
          echo "::error::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "::error::Failed to extract job_id from API response"
          echo "::error::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "::error::This usually means:"
          echo "::error::  1. The API returned an unexpected response format"
          echo "::error::  2. The command execution failed on the server"
          echo "::error::  3. The server IDs are invalid"
          echo "::error::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "::error::Full Response: $response"
          echo "::error::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1
        fi
        echo "::endgroup::"
        
        # Set outputs
        echo "job-id=$job_id" >> $GITHUB_OUTPUT
        echo "timestamp=$timestamp" >> $GITHUB_OUTPUT
        
        echo "::notice::✅ Command dispatched"
        echo "::notice::📋 Job ID: $job_id"
        echo "::notice::⏰ Timestamp: $timestamp"

    - name: Wait for command
      id: wait-command
      if: ${{ inputs.wait == 'true' }}
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        API_TOKEN: ${{ inputs.api-token }}
        ORG_ID: ${{ inputs.organization-id }}
        JOB_ID: ${{ steps.run-command.outputs.job-id }}
        TIMEOUT: ${{ inputs.timeout }}
        POLL_INTERVAL: ${{ inputs.poll-interval }}
      run: |
        set -euo pipefail

        source "${{ github.action_path }}/../scripts/poll.sh"
        poll_job "$API_URL" "$API_TOKEN" "$ORG_ID" "$JOB_ID" "$TIMEOUT" "$POLL_INTERVAL"

        echo "status=$POLL_STATUS" >> "$GITHUB_OUTPUT"

        if [[ "$POLL_STATUS" == "success" ]]; then
          echo "::notice::✅ Command completed successfully (${POLL_DURATION}s)"
        else
          echo "::error::Command job $JOB_ID ended with status: $POLL_STATUS (${POLL_DURATION}s)"
          exit 1
        fi
