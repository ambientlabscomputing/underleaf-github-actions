name: Update Major Version Tags

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  update-major-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          # Extract major version (e.g., v1.2.3 -> v1)
          MAJOR=$(echo $TAG | cut -d. -f1)
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          
          echo "Full tag: $TAG"
          echo "Major version: $MAJOR"
      
      - name: Update major version tag
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Delete the major version tag locally if it exists
          git tag -d $MAJOR 2>/dev/null || true
          
          # Create new major version tag pointing to current tag
          git tag $MAJOR $TAG
          
          # Force push the major version tag
          git push origin $MAJOR --force
          
          echo "✅ Updated $MAJOR tag to point to $TAG"
