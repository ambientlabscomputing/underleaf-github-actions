name: 'Underleaf Run Command (Deprecated)'
description: 'Execute commands on Underleaf servers via API. For new workflows, use ambient-labs/underleaf-github-actions/run-command@v2'
author: 'Ambient Labs'

branding:
  icon: 'terminal'
  color: 'green'

inputs:
  api-url:
    description: 'Underleaf API URL'
    required: false
    default: 'https://api.underleafdev.com'
  
  api-token:
    description: 'Underleaf API token (uf_xxxxx_...)'
    required: true
  
  organization-id:
    description: 'Organization ID'
    required: true
  
  command:
    description: 'Command to execute'
    required: true
  
  work-dir:
    description: 'Working directory for command execution'
    required: false
    default: ''
  
  timeout:
    description: 'Command timeout in seconds'
    required: false
    default: '300'
  
  all-servers:
    description: 'Run on all servers in the organization'
    required: false
    default: 'false'
  
  server-ids:
    description: 'Comma-separated list of server IDs to target'
    required: false
    default: ''
  
  tags:
    description: 'JSON object of tags to filter servers (e.g., {"environment":"production"})'
    required: false
    default: ''
  
  env-vars:
    description: 'JSON object of environment variables to set (e.g., {"KEY":"value"})'
    required: false
    default: ''

outputs:
  job-id:
    description: 'Job ID for tracking command execution'
    value: ${{ steps.delegate.outputs.job-id }}
  
  timestamp:
    description: 'Timestamp of command execution'
    value: ${{ steps.delegate.outputs.timestamp }}

runs:
  using: 'composite'
  steps:
    - name: Delegate to run-command
      id: delegate
      uses: ./run-command
      with:
        api-url: ${{ inputs.api-url }}
        api-token: ${{ inputs.api-token }}
        organization-id: ${{ inputs.organization-id }}
        command: ${{ inputs.command }}
        work-dir: ${{ inputs.work-dir }}
        timeout: ${{ inputs.timeout }}
        all-servers: ${{ inputs.all-servers }}
        server-ids: ${{ inputs.server-ids }}
        tags: ${{ inputs.tags }}
        env-vars: ${{ inputs.env-vars }}
